<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Image2 Layer Lab</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-panel" aria-label="图层剥离控制台">
        <div class="brand-row">
          <div>
            <p class="eyebrow" data-i18n="eyebrow">Progressive Layer Lab</p>
            <h1>Image2 Layer Lab</h1>
          </div>
          <span id="keyStatus" class="status-pill">检查中</span>
        </div>

        <div class="language-row" aria-label="Language">
          <label class="field compact-field" for="languageSelect">
            <span data-i18n="language">语言</span>
            <select id="languageSelect">
              <option value="zh">中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
            </select>
          </label>
        </div>

        <a class="promo-card" href="https://x.com/kanaworks_ai" target="_blank" rel="noreferrer">
          <img src="./assets/kanaworks-logo.png" alt="KanaWorks AI logo">
          <span>
            <strong>KanaWorks_AI</strong>
            <small data-i18n="promo">Want more? Follow me</small>
          </span>
        </a>

        <div class="mode-tabs" role="tablist" aria-label="工作区">
          <button class="active" type="button" data-workspace-view="layers" data-i18n="layerWorkspace">图层剥离</button>
          <button type="button" data-workspace-view="background" data-i18n="backgroundWorkspace">背景移除</button>
        </div>

        <label class="upload-box" for="sourceImage">
          <span data-i18n="sourceImage">原图</span>
          <strong data-i18n="chooseImage">选择或拖入图片</strong>
          <small data-i18n="imageHint">PNG / JPG / WebP，建议先用 1K 到 2K 尺寸做分层</small>
          <input id="sourceImage" type="file" accept="image/png,image/jpeg,image/webp">
        </label>

        <div id="layerControls" class="view-controls" data-workspace-panel="layers">
        <div class="settings-grid">
          <label class="field" for="layerName">
            <span data-i18n="layerName">图层名</span>
            <input id="layerName" type="text" value="剥离图层 1" maxlength="80">
          </label>

          <label class="field" for="layerCategory">
            <span data-i18n="semanticLevel">语义层级</span>
            <select id="layerCategory">
              <option value="Distractor" data-i18n="catDistractor">干扰元素</option>
              <option value="Secondary" data-i18n="catSecondary">次要物品</option>
              <option value="Primary" data-i18n="catPrimary">人物/主体</option>
              <option value="Text" data-i18n="catText">文字/标识</option>
              <option value="Scene" data-i18n="catScene">场景结构</option>
              <option value="Background" data-i18n="catBackground">背景</option>
            </select>
          </label>
        </div>

        <section class="tool-section" aria-label="选择工具">
          <div class="section-title" data-i18n="selection">选择</div>
          <div class="segmented tool-segmented" role="group" aria-label="选择工具">
            <button class="tool-button active" type="button" data-tool="brush" data-i18n="brush">画笔</button>
            <button class="tool-button" type="button" data-tool="erase" data-i18n="erase">擦除</button>
            <button class="tool-button" type="button" data-tool="rect" data-i18n="rect">矩形</button>
            <button class="tool-button" type="button" data-tool="circle" data-i18n="circle">圆形</button>
            <button class="tool-button" type="button" data-tool="roundRect" data-i18n="roundRect">倒角矩形</button>
            <button class="tool-button" type="button" data-tool="pen" data-i18n="pen">钢笔</button>
            <button class="tool-button" type="button" data-tool="magic" data-i18n="magic">魔术棒</button>
          </div>

          <div id="selectionModeRow" class="mode-row">
            <span data-i18n="magicSelectionMode">魔术棒模式</span>
            <div class="segmented compact-segmented" role="group" aria-label="魔术棒模式">
              <button type="button" data-selection-mode="replace" data-i18n="modeReplace">替换</button>
              <button class="active" type="button" data-selection-mode="add" data-i18n="modeAdd">加选</button>
              <button type="button" data-selection-mode="subtract" data-i18n="modeSubtract">减选</button>
            </div>
          </div>

          <div id="penToolRow" class="pen-row" hidden>
            <div class="pen-actions">
              <button id="finishPenButton" class="secondary-button" type="button" data-i18n="finishPen">闭合成选区</button>
              <button id="undoPenPointButton" class="secondary-button" type="button" data-i18n="undoPenPoint">撤销点</button>
              <button id="clearPenButton" class="secondary-button danger" type="button" data-i18n="clearPenPath">清空路径</button>
            </div>
            <output id="penPointCount" class="pen-count">0 点</output>
          </div>

          <div class="command-grid">
            <button id="undoSelectionButton" class="secondary-button" type="button" disabled data-i18n="undo">撤销上一步</button>
            <button id="redoSelectionButton" class="secondary-button" type="button" disabled data-i18n="redo">重做</button>
            <button id="invertSelectionButton" class="secondary-button" type="button" data-i18n="invert">反选</button>
            <button id="cleanupSelectionButton" class="secondary-button" type="button" data-i18n="cleanup">填洞/平滑</button>
          </div>

          <div class="range-pair">
            <label class="field" for="brushSize">
              <span data-i18n="brushSize">画笔大小</span>
              <input id="brushSize" type="range" min="4" max="140" step="1" value="36">
            </label>
            <output id="brushSizeValue" class="range-value">36</output>
          </div>

          <div class="range-pair">
            <label class="field" for="magicTolerance">
              <span data-i18n="magicTolerance">魔术棒容差</span>
              <input id="magicTolerance" type="range" min="4" max="96" step="1" value="28">
            </label>
            <output id="magicToleranceValue" class="range-value">28</output>
          </div>

          <div class="range-pair">
            <label class="field" for="magicGrow">
              <span data-i18n="magicGrow">魔术棒扩边</span>
              <input id="magicGrow" type="range" min="0" max="8" step="1" value="2">
            </label>
            <output id="magicGrowValue" class="range-value">2</output>
          </div>

          <div id="roundRadiusRow" class="range-pair">
            <label class="field" for="roundRadius">
              <span data-i18n="roundRadius">倒角半径</span>
              <input id="roundRadius" type="range" min="0" max="220" step="1" value="36">
            </label>
            <output id="roundRadiusValue" class="range-value">36</output>
          </div>
        </section>

        <section class="tool-section" aria-label="剥离与补洞">
          <div class="section-title" data-i18n="peel">剥离</div>
          <div class="command-grid">
            <button id="peelQuickButton" class="primary-button" type="button" data-i18n="peelQuick">剥离 + 快速补洞</button>
            <button id="peelAiButton" class="primary-button alt" type="button" data-i18n="peelAi">剥离 + GPT补洞</button>
            <button id="peelOnlyButton" class="secondary-button" type="button" data-i18n="peelOnly">仅剥离成图层</button>
            <button id="healButton" class="secondary-button" type="button" data-i18n="quickHeal">快速补当前选择</button>
          </div>
        </section>

        <label class="field" for="inpaintPrompt">
          <span data-i18n="inpaintPrompt">GPT补洞提示词</span>
          <textarea id="inpaintPrompt" rows="5">Remove only the selected masked element and its associated shadows or reflections. Reconstruct the covered area seamlessly by continuing the original lines, textures, lighting, and perspective. Keep every unmasked part of the image unchanged and do not add new objects.</textarea>
        </label>

        <div class="settings-grid">
          <label class="field" for="imageModel">
            <span data-i18n="imageModel">图像模型</span>
            <select id="imageModel">
              <option value="gpt-image-2" selected>gpt-image-2</option>
              <option value="chatgpt-image-latest">chatgpt-image-latest</option>
              <option value="gpt-image-1.5">gpt-image-1.5</option>
              <option value="gpt-image-1">gpt-image-1</option>
            </select>
          </label>

          <label class="field" for="imageQuality">
            <span data-i18n="quality">质量</span>
            <select id="imageQuality">
              <option value="auto">auto</option>
              <option value="low">low</option>
              <option value="medium" selected>medium</option>
              <option value="high">high</option>
            </select>
          </label>
        </div>

        <section class="tool-section" aria-label="导出">
          <div class="section-title" data-i18n="export">导出</div>
          <div class="command-grid">
            <button id="exportPsdButton" class="primary-button" type="button" data-i18n="exportPsd">导出 PSD</button>
            <button id="exportPngButton" class="secondary-button" type="button" data-i18n="exportPng">导出合成 PNG</button>
            <button id="clearMaskButton" class="secondary-button" type="button" data-i18n="clearSelection">清空选择</button>
            <button id="resetButton" class="secondary-button danger" type="button" data-i18n="resetCanvas">重置画布</button>
          </div>
        </section>
        </div>

        <div id="backgroundControls" class="view-controls" data-workspace-panel="background" hidden>
          <section class="tool-section" aria-label="纯色背景移除">
            <div class="section-title" data-i18n="solidBgRemove">纯色背景移除</div>
            <div class="settings-grid">
              <label class="field" for="bgPreset">
                <span data-i18n="bgColor">背景颜色</span>
                <select id="bgPreset">
                  <option value="white" data-i18n="bgWhite">白色</option>
                  <option value="black" data-i18n="bgBlack">黑色</option>
                  <option value="green" data-i18n="bgGreen">绿色</option>
                  <option value="custom" data-i18n="bgCustom">自定义</option>
                </select>
              </label>

              <label class="field color-field" for="bgCustomColor">
                <span data-i18n="customColor">自定义颜色</span>
                <input id="bgCustomColor" type="color" value="#ffffff">
              </label>
            </div>

            <div class="settings-grid">
              <label class="field" for="bgOutputRatio">
                <span data-i18n="outputRatio">输出比例</span>
                <select id="bgOutputRatio">
                  <option value="auto" data-i18n="ratioAuto">自适应</option>
                  <option value="original" data-i18n="ratioOriginal">原图比例</option>
                  <option value="16:9">16:9</option>
                  <option value="9:16">9:16</option>
                  <option value="1:1">1:1</option>
                  <option value="2:3">2:3</option>
                  <option value="3:2">3:2</option>
                  <option value="4:5">4:5</option>
                  <option value="5:4">5:4</option>
                </select>
              </label>

              <label class="field" for="bgPadding">
                <span data-i18n="outputPadding">留白</span>
                <select id="bgPadding">
                  <option value="0.02">2%</option>
                  <option value="0.06" selected>6%</option>
                  <option value="0.1">10%</option>
                  <option value="0.16">16%</option>
                </select>
              </label>
            </div>

            <div class="range-pair">
              <label class="field" for="bgTolerance">
                <span data-i18n="bgTolerance">颜色容差</span>
                <input id="bgTolerance" type="range" min="0" max="160" step="1" value="36">
              </label>
              <output id="bgToleranceValue" class="range-value">36</output>
            </div>

            <div class="range-pair">
              <label class="field" for="bgFeather">
                <span data-i18n="edgeFeather">边缘柔化</span>
                <input id="bgFeather" type="range" min="0" max="6" step="1" value="1">
              </label>
              <output id="bgFeatherValue" class="range-value">1</output>
            </div>

            <div class="background-preview">
              <div class="section-title" data-i18n="bgPreview">移除预览</div>
              <div id="bgPreviewBox" class="preview-box">
                <span id="bgPreviewEmpty" data-i18n="bgPreviewEmpty">调好颜色和容差后点预览，这里会显示透明背景效果。</span>
                <canvas id="bgPreviewCanvas" hidden></canvas>
              </div>
            </div>

            <div class="command-grid">
              <button id="removeSolidBgButton" class="primary-button" type="button" data-i18n="removeSolidBg">预览移除背景</button>
              <button id="applySolidBgButton" class="secondary-button" type="button" disabled data-i18n="applyPreview">应用预览</button>
              <button id="resetSolidBgButton" class="secondary-button danger" type="button" data-i18n="retrySolidBg">重新来做</button>
              <button id="downloadTransparentButton" class="secondary-button" type="button" disabled data-i18n="downloadTransparent">下载透明 PNG</button>
            </div>
          </section>
        </div>

        <p id="message" class="message" role="status" aria-live="polite"></p>
        <div id="aiProgress" class="ai-progress" hidden>
          <div class="progress-meta">
            <span id="aiProgressLabel" data-i18n="aiProgressPreparing">准备 GPT 补洞...</span>
            <output id="aiProgressValue">0%</output>
          </div>
          <div class="progress-track">
            <span id="aiProgressBar"></span>
          </div>
        </div>
      </aside>

      <section id="workbench" class="workbench" aria-label="分层工作台">
        <div class="canvas-panel">
          <div class="canvas-toolbar">
            <div>
              <strong id="imageTitle" data-i18n="waitingImage">等待图片</strong>
              <span id="canvasMeta" data-i18n="notLoaded">未加载</span>
            </div>
            <div class="zoom-controls" aria-label="画布缩放">
              <button id="zoomOutButton" class="zoom-button" type="button" disabled aria-label="Zoom out">-</button>
              <input id="zoomSlider" class="zoom-range" type="range" min="25" max="800" step="5" value="100" disabled aria-label="Zoom">
              <button id="zoomInButton" class="zoom-button" type="button" disabled aria-label="Zoom in">+</button>
              <output id="zoomValue" class="zoom-value">100%</output>
              <button id="zoomFitButton" class="zoom-button text-button" type="button" disabled data-i18n="zoomFit">适应</button>
              <button id="panModeButton" class="zoom-button text-button" type="button" disabled data-i18n="panMode">移动</button>
            </div>
            <span id="selectionStats">选择 0 px</span>
          </div>

          <div id="canvasStage" class="canvas-stage">
            <div id="dropHint" class="drop-hint">
              <strong data-i18n="dropStart">拖入图片开始</strong>
              <span data-i18n="dropHint">用选择工具圈出人物、物品、文字或场景区域</span>
            </div>
            <canvas id="backgroundCanvas" class="image-canvas"></canvas>
            <canvas id="selectionCanvas" class="selection-canvas"></canvas>
            <canvas id="overlayCanvas" class="overlay-canvas" aria-hidden="true"></canvas>
          </div>
        </div>

        <aside class="layer-panel" aria-label="PSD 图层">
          <div class="layer-header">
            <div>
              <p class="eyebrow">PSD Layers</p>
              <h2 data-i18n="layers">图层</h2>
            </div>
            <span id="layerCount">0</span>
          </div>

          <section class="psd-preview" aria-label="PSD 导出预览">
            <div class="section-title" data-i18n="psdPreview">PSD 预览</div>
            <canvas id="psdPreviewCanvas" width="160" height="110"></canvas>
            <strong id="psdLayerSummary"></strong>
            <span id="psdLayerDetails"></span>
          </section>

          <div id="layerList" class="layer-list"></div>
        </aside>
      </section>
    </main>

    <script src="./vendor/ag-psd-bundle.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
